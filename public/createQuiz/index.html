<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/createQuiz.css">
    <link rel="stylesheet" href="/css/header.css">
    <title>Create Quiz</title>
</head>

<body>
    <div id="header"></div>
    <div class="whole-container">
        <div class="header-section">
            <h2>Create your own Quiz</h2>
            <h4>and publish to others</h4>
        </div>
        <div class="quiz-details">
            <div class="quiz-detail">
                <p>Quiz name</p>
                <input type="text" id="quizName">
            </div>

            <div class="quiz-detail">
                <p>Topic</p>
                <select id="topic-drop-down">
                            <option value="" selected disabled>All</option>
                            <option value="sports">Sports</option>
                            <option value="science">Science</option>
                            <option value="programming">Programming</option>
                            <option value="history">History</option>
                            <option value="movies">Movies</option>
                            <option value="music">Music</option>
                </select>`
            </div>

            <div class="quiz-detail">
                <p>Questions<button id="addQuestionsButton" onclick="addQuestions()">Add</button></p>
                <div class="question-container">
                    <p>Question Name</p>
                    <input type="text" id="question-1-name" placeholder="Question Name">

                    <div id="options-1-container">
                        <p>Options<button id="addOptionsButton" onclick="addOptions(1)">Add</button></p>
                        <div class="option">
                            <input 
                                type="text" 
                                id='question-1-option-1'
                                onblur="updateCorrectAnswerChoices(event,1,1)"
                            > 
                        </div>
                        <div class="option">
                            <input 
                                type="text" 
                                id='question-1-option-2'
                                onblur="updateCorrectAnswerChoices(event,1,2)"
                            > 
                        </div>
                    </div>

                    <p>Correct Answer</p>
                    <select name="correctAnswerQn1" id="correctAnswerQn1">
                        <option id="answer-1-option-1"></option>
                        <option id="answer-1-option-2"></option>
                    </select>
                </div>
            </div>
        </div>
        <div class="submit-button-container">
            <button id="submitButton" onclick="submit()">Submit</button>
        </div>
    </div>

</body>
<script src="/js/header.js"></script>
<script src="/js/createQuiz.js"></script>

</html>
