<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Create Quiz</title>
</head>

<body>
    <div class="whole-container">
        <div class="header-section">
            <h2>Create your own Quiz</h2>
            <h4>and publish to others</h4>
        </div>
        <div class="quiz-details">
            <div class="quiz-detail">
                <p>Quiz name</p>
                <input type="text" id="quizName">
            </div>
            <div class="quiz-detail">
                <p>Topic</p>
                <input type="text" id="quizTopic">
            </div>
            <div class="quiz-detail">
                <p>Question<button>Add</button></p>
                <input type="text" id="question">

                <div id="optionsContainer">
                    <p>Options<button id="addOptionsButton">Add</button></p>
                    <div class="option">
                        <input type="text" id="question-1-option-1">
                        <button>X</button>
                    </div>
                </div>

                <p>Correct Answer</p>
                <select name="correctAnswerQn1" id="correctAnswerQn1">
                    
                </select>
            </div>
        </div>
        <div class="submit-button-container">
            <button id="submitButton"></button>
        </div>
    </div>

</body>
<script src="script.js"></script>

</html>
